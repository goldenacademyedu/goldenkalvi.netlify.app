<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Login</title>

<style>
  *{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI', sans-serif;
  }

  body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#1e3c72,#2a5298);
  }

  .login-box{
    width:350px;
    background:white;
    padding:40px 30px;
    border-radius:18px;
    box-shadow:0 10px 30px rgba(0,0,0,0.3);
    text-align:center;
  }

  .login-box h1{
    margin-bottom:25px;
    color:#1e3c72;
    font-size:32px;
  }

  .input-box{
    width:100%;
    margin-bottom:18px;
  }

  .input-box input{
    width:100%;
    padding:14px;
    border:1px solid #ccc;
    border-radius:10px;
    font-size:16px;
    transition:0.3s;
  }

  .input-box input:focus{
    border-color:#1e3c72;
    outline:none;
    box-shadow:0 0 8px rgba(30,60,114,0.3);
  }

  .login-btn{
    width:100%;
    padding:14px;
    border:none;
    border-radius:10px;
    background:#1e3c72;
    color:white;
    font-size:17px;
    cursor:pointer;
    transition:0.3s;
  }

  .login-btn:hover{
    background:#16325c;
  }

  .create-account{
    margin-top:20px;
    display:block;
    color:#1e3c72;
    text-decoration:none;
    font-weight:600;
  }

  .create-account:hover{
    text-decoration:underline;
  }

  .logo{
    width:120px;
    margin-bottom:15px;
  }
</style>
</head>

<script type="module">

import { auth } from "./firebase.js";

import {
  signInWithEmailAndPassword
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

window.login = function(){

  let email = document.querySelector('input[type="email"]').value;
  let password = document.querySelector('input[type="password"]').value;

  signInWithEmailAndPassword(auth, email, password)

  .then((userCredential) => {

    alert("Login Successful");

    window.location.href = "dashboard.html";

  })

  .catch((error) => {

    alert(error.message);

  });

}

</script>
 
<body>

<div class="login-box">

  <!-- Optional Logo -->
  <img src="logo.png" class="logo">

  <h1>Student Login</h1>

  <div class="input-box">
    <input type="email" placeholder="Enter Email">
  </div>

  <div class="input-box">
    <input type="password" placeholder="Enter Password">
  </div>

  <button type="button" class="login-btn" onclick="login()">
Login
</button>

  <a href="signup.html" class="create-account">
  Create New Account
</a>

</div>

</body>
</html>
