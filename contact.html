<!-- CONTACT SECTION -->
<section class="contact-section">

  <h2>Contact Us</h2>

  <div class="contact-container">

    <!-- LEFT SIDE -->
    <div class="contact-info">

      <div class="info-box">
        📞 <span>+91 88831 17520</span>
      </div>

      <div class="info-box">
        📧 <span>goldenacademyedu@gmail.com</span>
      </div>

      <div class="info-box">
        📍 <span>Balaji Nagar, Kattur, Trichy</span>
      </div>

      <!-- MAP -->
      <div class="map-box">

        <iframe
          src="https://maps.google.com/maps?q=trichy&t=&z=13&ie=UTF8&iwloc=&output=embed"
          width="100%"
          height="250"
          style="border:0;"
          allowfullscreen=""
          loading="lazy">
        </iframe>

      </div>

    </div>

    <!-- RIGHT SIDE -->
    <div class="contact-form">

      <!-- NETLIFY FORM -->
      <form name="contact" method="POST" data-netlify="true">

        <input type="hidden" name="form-name" value="contact" />

        <input
          type="text"
          name="name"
          placeholder="Your Name"
          required
        />

        <input
          type="email"
          name="email"
          placeholder="Your Email"
          required
        />

        <textarea
          name="message"
          rows="6"
          placeholder="Your Message">
        </textarea>

        <button type="submit">
          Send Message
        </button>

      </form>

    </div>

  </div>

</section>

<!-- FOOTER -->
<footer class="footer">
  © 2026 Golden Academy
</footer>

<!-- JAVASCRIPT -->
<script>
const toggle = document.getElementById("menu-toggle");
const navLinks = document.getElementById("nav-links");

toggle.addEventListener("click", () => {
  navLinks.classList.toggle("active");
});
</script>

</body>
