<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Dashboard</title>

<style>

body{
  margin:0;
  font-family:'Segoe UI', sans-serif;
  background:#f4f6f9;
}

.navbar{
  background:#1e3c72;
  color:white;
  padding:15px 30px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logout-btn{
  background:white;
  color:#1e3c72;
  border:none;
  padding:10px 18px;
  border-radius:8px;
  cursor:pointer;
  font-weight:600;
  cursor:pointer;
}

.container{
  padding:40px;
}

.card{
  background:white;
  padding:30px;
  border-radius:15px;
  box-shadow:0 5px 20px rgba(0,0,0,0.1);
  max-width:700px;
}

.student-name{
  color:#1e3c72;
}

</style>
</head>

<body>

<div class="navbar">
  <h2>Golden Academy</h2>

  <button class="logout-btn" onclick="logout()">
    Logout
  </button>
</div>

<div class="container">

  <div class="card">

    <h1>
      Welcome,
      <span id="studentName" class="student-name">
        Student
      </span>
      🎓
    </h1>

    <p>
      You have successfully logged into the student dashboard.
    </p>

  </div>

</div>

<script type="module">

import { auth } from "./firebase.js";

import {
  onAuthStateChanged,
  signOut
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const studentName = document.getElementById("studentName");

onAuthStateChanged(auth, (user) => {

  if(user){

    studentName.innerText = user.email;

  } else {

    window.location.href = "student-login.html";

  }

});

window.logout = function(){

  signOut(auth)

  .then(() => {

    alert("Logged Out");

    window.location.href = "student-login.html";

  })

  .catch((error) => {

    alert(error.message);

  });

}

</script>

</body>
</html>
